version: "3.9"

services:
  backend:
    build: .
    container_name: healthcare_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - db_data:/app/healthcare.db
    networks:
      - healthcare_net
    restart: unless-stopped

networks:
  healthcare_net:
    driver: bridge

volumes:
  db_data:
